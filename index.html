<!DOCTYPE html>
<html lang="pt-BR" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expresso Alfa</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" type="image/png" href="src/img/logoAlfa.png">
    <img src="src/img/logoAlfa.png" alt="Expressoalfa" style="display:none;">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">


    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="fundo">
        <div class="page-wrapper">

            <img src="src/img/logoAlfa.png" class="logo">
            <div class="tagline">
                Coletas e entregas por toda a cidade.

            </div>

            <a class="link-btn whatsapp" href="https://wa.me/5522988152624?text=Olá,+gostaria+de+pedir+uma+entrega!"
                target="_blank">
                <div class="icon-box">
                    <i data-lucide="message-circle"></i>
                </div>
                Falar no WhatsApp
            </a>

            <a class="link-btn maps" href="https://maps.app.goo.gl/gZ1AQbTv3SdpRxXeA" target="_blank">
                <div class="icon-box">
                    <i data-lucide="map-pin"></i>
                </div>
                Ver Localização
            </a>

            <a class="link-btn review"
                href="https://www.google.com/maps/place/Expresso+Alfa+Coletas+E+Entregas/@-22.2247743,-42.5241831,17z/data=!3m1!4b1!4m6!3m5!1s0x97f5089e132305:0x4820798d991e56a3!8m2!3d-22.2247793!4d-42.5216082!16s%2Fg%2F11xcfkdw75?entry=ttu&g_ep=EgoyMDI2MDMyMy4xIKXMDSoASAFQAw%3D%3D"
                target="_blank">
                <div class="icon-box">
                    <i data-lucide="star"></i>
                </div>
                Avaliar no Google
            </a>

            <div class="footer">
                © 2026 Expresso Alfa — Todos os direitos reservados
            </div>

        </div>

        <script src="script.js">

        </script>
</body>

</html>
